# -*- conf -*-
# foot terminal config
# Font size: change the number below to taste.
#   8  = foot default (small)
#   12 = clearly bigger
#   14 = large
# 13 is set here as a comfortable default.
font=Gallant Raster Term:size=13, Symbols Nerd Font:size=13

# Runtime adjustment step for Ctrl+plus / Ctrl+minus
font-size-adjustment=1

# pywal16 colors (regenerated by `wal -i <image>`).
# Comment this out if the file doesn't exist yet.
include=/home/latency/.cache/wal/colors-foot-dark.ini
